name: Deploy to VPS

on:
  push:
    branches: [vps-deploy]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build onelink-web image and deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build onelink-web image
        run: |
          docker buildx build --load \
            -f deploy/Dockerfile.vps \
            -t onelink-web:latest .

      - name: Save image as tarball
        run: docker save onelink-web:latest | gzip > onelink-web.tar.gz

      - name: Copy image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: mgrinberg
          key: ${{ secrets.VPS_SSH_KEY }}
          source: onelink-web.tar.gz
          target: /tmp/

      - name: Load image and restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: mgrinberg
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker load < /tmp/onelink-web.tar.gz
            rm /tmp/onelink-web.tar.gz
            cd /opt/onelink
            docker compose -f docker-compose.vps.yml up -d --force-recreate onelink-web
            docker compose -f docker-compose.vps.yml ps
